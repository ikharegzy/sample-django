version: "3.9"

services:
  web:
    build: .
    container_name: sample-django-web

    command: >
      gunicorn mysite.wsgi:application
      --bind 0.0.0.0:8000
    env_file: .env
    environment:
      MIGRATE_AND_CREATE_USER_ON_STARTUP: "true"
    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - .:/app

    networks: [application]

  db:
    image: postgres:17.5-alpine
    container_name: sample-django-db

    env_file: .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 5

    networks: [application]

networks:
  application:

volumes:
  postgres_data:
